<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor BPN</title>

    <link rel="stylesheet" href="styles.css">

    <script src="./lib/xlsx.full.min.js"></script>
    <script type="module" src="script.js" defer></script>
</head>
<body>

    <!-- CONTROLES -->
    <div class="container container--buttons">
        
        <label for="input-file" class="input flex-center btn">
            Seleccionar archivo
        </label>

        <input type="file" id="input-file" hidden multiple>

        <button id="btn-download" class="input flex-center btn btn--success" disabled>
            Descargar Excel
        </button>

    </div>

    <!-- VISUALIZADOR -->
    <div class="container container--viewer flex-center" id="drop-zone">
        <p class="text-drag">Arrastrá los archivos acá</p>
    </div>

</body>
</html>
