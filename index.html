<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor BPN</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script type="module" src="script.js" defer></script>
</head>
<body>
    <div class="container-btn">
        <label for="input-archivo" class="input centrar-texto input-archivo">
            Seleccionar archivo
        </label>
        <input type="file" id="input-archivo" style="display:none;" multiple>
        <button id="btn-descargar-excel" class="input centrar-texto btn-descargar-excel" disabled>
            Descargar Excel
        </button>
    </div>
    <div class="container-visualizador centrar-texto" id="drop-zone">
        <p class="leyenda-arrastrar">Arrastre los archivos acá</p>
    </div>
</body>
</html>
